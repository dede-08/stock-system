<div class = "container mt-5">
  <div class="login-container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-4">
        <div class="card shadow-lg">
          <div class="card-body p-5">
            <div class="text-center mb-4">
              <img src="../assets/logo.png" alt="Logo" class="mb-3" style="width: 100px; border-radius: 50px;">
              <h2 class="card-title text-primary">Iniciar Sesión</h2>
              <p class="text-muted">Sistema de Gestión de Inventarios</p>
            </div>

            <form (ngSubmit)="onLogin()" #loginForm="ngForm">
              <div class="mb-3">
                <label for="username" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" [(ngModel)]="email" name="email" required
                  placeholder="Ingrese su email">
              </div>

              <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" [(ngModel)]="password" name="password"
                  required placeholder="Ingrese su contraseña">
              </div>

              <div *ngIf="error" class="alert alert-danger" role="alert">
                {{ error }}
              </div>

              <button type="submit" class="btn btn-primary w-100" [disabled]="!loginForm.form.valid || loading">
                <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                {{ loading ? 'Ingresando…' : 'Ingresar' }}
              </button>
            </form>
            <p class="text-center mt-3 mb-0">¿No tienes cuenta? <a routerLink="/register">Regístrate</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
