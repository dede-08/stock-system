<div class="container">
  <div class="row justify-content-center align-items-center vh-100">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-lg">
        <div class="card-body p-4">
          <div class="text-center mb-4">
            <img src="assets/logo.png" alt="Logo" class="mb-3" style="width: 80px; border-radius: 50%;">
            <h2 class="card-title text-primary">Crear cuenta</h2>
            <p class="text-muted">Sistema de Gestión de Inventarios</p>
          </div>
          <form (ngSubmit)="register()" #registerForm="ngForm">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="name" class="form-label">Nombre</label>
                <input type="text" id="name" name="name" class="form-control" [(ngModel)]="name" required maxlength="50" placeholder="Nombres">
              </div>
              <div class="col-md-6 mb-3">
                <label for="lastname" class="form-label">Apellido</label>
                <input type="text" id="lastname" name="lastname" class="form-control" [(ngModel)]="lastname" required maxlength="50" placeholder="Apellidos">
              </div>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="age" class="form-label">Edad</label>
                <input type="number" id="age" name="age" class="form-control" [(ngModel)]="age" required min="18" max="120" placeholder="18+">
              </div>
              <div class="col-md-6 mb-3">
                <label for="telephone" class="form-label">Teléfono <span class="text-muted">(opcional)</span></label>
                <input type="tel" id="telephone" name="telephone" class="form-control" [(ngModel)]="telephone" maxlength="20" placeholder="999 999 999">
              </div>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" id="email" name="email" class="form-control" [(ngModel)]="email" required maxlength="100" placeholder="correo@ejemplo.com">
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Contraseña</label>
              <input type="password" id="password" name="password" class="form-control" [(ngModel)]="password" required minlength="8" placeholder="Mínimo 8 caracteres">
            </div>
            <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
            <div *ngIf="success" class="alert alert-success">¡Cuenta creada! Redirigiendo al login…</div>
            <button type="submit" class="btn btn-primary w-100" [disabled]="!registerForm.form.valid || success">Registrarse</button>
          </form>
          <p class="text-center mt-3 mb-0">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
